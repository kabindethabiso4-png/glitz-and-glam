<!DOCTYPE html>
<html lang="en"
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account | Glitz &amp; Glam</title>
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section  id="newPasswordForm" class="admin-form" >
      <h3>Choose a new password</h3>
      <label for="newPassword">New password (complete all 5 safety checks)</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" aria-describedby="newPasswordStrength" required>
      <div class="password-strength" id="newPasswordStrength" data-password-strength="newPassword">
        <p class="password-strength-count" data-strength-count aria-live="polite">0 of 5 safety checks passed</p>
        <ul class="password-checklist">
          <li data-password-check="length"><input type="checkbox" disabled aria-hidden="true">At least 8 characters</li>
          <li data-password-check="uppercase"><input type="checkbox" disabled aria-hidden="true">An uppercase letter</li>
          <li data-password-check="lowercase"><input type="checkbox" disabled aria-hidden="true">A lowercase letter</li>
          <li data-password-check="number"><input type="checkbox" disabled aria-hidden="true">A number</li>
          <li data-password-check="symbol"><input type="checkbox" disabled aria-hidden="true">A symbol (for example, ! or #)</li>
        </ul>
      </div>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" aria-describedby="newPasswordMatch" required>
      <p id="newPasswordMatch" class="password-match" aria-live="polite"></p>
      <label class="consent-label password-visibility"><input id="showNewPasswords" type="checkbox"><span>Show passwords while typing</span></label>
      <button class="btn" type="submit">Update password</button>
    </section>

  <footer>&copy; <span id="year"></span> Glitz &amp; Glam by Doesitbest <a class="admin-entry" href="privacy.html">Privacy</a></footer>
<script type="module" src="js/account.js"></script>
<script src="js/theme.js" defer></script>
  
</body>
</html>
